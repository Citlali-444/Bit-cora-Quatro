  .wrap{max-width:760px;margin:0 auto;padding:28px 20px 60px;position:relative;z-index:1;}
  .eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-on-bg);margin:0 0 6px;text-shadow:0 1px 4px rgba(0,0,0,.35);}
  h1{font-family:var(--font-display);font-weight:700;font-size:34px;letter-spacing:.01em;margin:0 0 10px;text-transform:uppercase;color:var(--ink-on-bg);text-shadow:0 1px 6px rgba(0,0,0,.35);}
  .rule{height:5px;background:var(--gold);border-radius:2px;margin-bottom:22px;position:relative;}
  .rule::after{content:'';position:absolute;left:0;right:0;top:9px;height:1.5px;background:var(--gold);opacity:.55;}
  .datebar{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap;}
  .datebar label{font-family:var(--font-mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-on-bg);text-shadow:0 1px 4px rgba(0,0,0,.35);}
  input[type=date]{font-family:var(--font-mono);font-size:15px;padding:7px 10px;border:1px solid var(--line-on-card);border-radius:4px;background:var(--card);color:var(--ink-on-card);}
  .section-title{font-family:var(--font-display);font-weight:600;font-size:17px;text-transform:uppercase;letter-spacing:.05em;margin:30px 0 12px;color:var(--gold-dark);display:flex;align-items:center;gap:8px;text-shadow:0 1px 4px rgba(0,0,0,.35);}
  .section-title .n{font-family:var(--font-mono);font-size:12px;color:var(--muted-on-bg);text-shadow:0 1px 4px rgba(0,0,0,.35);}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;color:var(--ink-on-card);}
  .authbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;font-family:var(--font-mono);font-size:12px;}
  .authbar .iconbtn{color:var(--muted-on-bg);}
  .authbar #loginErr{color:var(--error);}
  .authbar input{font-family:var(--font-body);font-size:13px;padding:6px 8px;border:1px solid var(--line-on-card);border-radius:4px;background:var(--card);color:var(--ink-on-card);}
  .comments{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line-on-card);}
  .comments-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;}
  .comment-item{font-size:12px;color:var(--ink-on-card);}
  .comment-author{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted-on-card);}
  .comment-ts{font-family:var(--font-mono);font-size:11px;color:var(--muted-on-card);}
  .comment-text{margin:2px 0 0;}
  .comment-form{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;}
  .comment-form textarea{flex:1;min-width:140px;font-family:var(--font-body);font-size:13px;padding:6px 8px;border:1px solid var(--line-on-card);border-radius:4px;}
  .grid-form{display:grid;grid-template-columns:90px 140px 1fr 130px;gap:10px;margin-bottom:10px;}
  .grid-form .full{grid-column:1/-1;}
  label.f{display:block;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-on-card);margin-bottom:4px;}
  input[type=text],select,textarea{width:100%;font-family:var(--font-body);font-size:14px;padding:8px 9px;border:1px solid var(--line-on-card);border-radius:4px;background:var(--card-2);color:var(--ink-on-card);}
  input[type=text]:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:1px;}
  .btn{font-family:var(--font-mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:9px 16px;border-radius:5px;border:1px solid var(--gold);background:var(--gold);color:#241719;cursor:pointer;font-weight:600;}
  .btn:hover{opacity:.88;}
  .btn.secondary{background:transparent;color:var(--ink-on-bg);border:1px solid var(--line-on-bg);text-shadow:0 1px 3px rgba(0,0,0,.3);}
  .btn.red{background:var(--gold);border-color:var(--gold);color:#241719;}
  .btn.small{padding:5px 10px;font-size:11px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .err{color:var(--error);font-size:12px;margin:2px 0 0;font-family:var(--font-mono);}
  .entries{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
  .ticket{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px 12px 0;position:relative;overflow:hidden;color:var(--ink-on-card);}
  .ticket::before{content:'';position:absolute;left:0;top:0;bottom:0;width:26px;background-image:radial-gradient(circle at 13px 10px, var(--line-on-card) 4px, transparent 4.5px);background-repeat:repeat-y;background-size:26px 20px;border-right:1.5px dashed var(--line);}
  .parada{font-family:var(--font-mono);font-size:13px;color:var(--muted-on-card);min-width:36px;text-align:center;padding-top:2px;margin-left:26px;}
  .ticket-body{flex:1;min-width:0;}
  .stamp{display:inline-block;font-family:var(--font-mono);font-weight:600;font-size:14px;letter-spacing:.04em;color:var(--gold-oncard);border:1.5px solid var(--gold-oncard);border-radius:4px;padding:2px 8px;transform:rotate(-1.2deg);margin-bottom:6px;}
  .tipo-badge{display:inline-block;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;background:var(--teal-bg);color:var(--teal);padding:2px 8px;border-radius:3px;margin-left:8px;vertical-align:2px;}
  .ruta-badge{display:inline-block;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;background:rgba(207,144,96,.16);color:var(--gold-oncard);padding:2px 8px;border-radius:3px;margin-left:8px;vertical-align:2px;}
  .nota{font-size:14px;line-height:1.5;margin:2px 0 0;}
  .meta{font-family:var(--font-mono);font-size:11px;color:var(--muted-on-card);margin-top:6px;}
  .actions{display:flex;flex-direction:column;gap:2px;padding-top:2px;}
  .iconbtn{background:none;border:none;color:var(--muted-on-card);cursor:pointer;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:2px 4px;text-align:right;}
  .iconbtn:hover{color:var(--teal-oncard);}
  .hist-toggle{background:none;border:none;color:var(--teal-oncard);cursor:pointer;font-family:var(--font-mono);font-size:11px;text-decoration:underline;padding:0;margin-top:4px;}
  .hist-list{margin:6px 0 0;padding:8px 10px;background:var(--card-2);border-radius:5px;font-family:var(--font-mono);font-size:11px;color:var(--muted-on-card);display:flex;flex-direction:column;gap:3px;}
  .edit-form{display:grid;grid-template-columns:80px 130px 1fr 110px;gap:8px;margin-bottom:8px;}
  .edit-form .full{grid-column:1/-1;}
  .edit-actions{display:flex;gap:8px;}
  .panel .btn.secondary,.ticket .btn.secondary{color:var(--ink-on-card);border-color:var(--line-on-card);text-shadow:none;}
  .empty{font-family:var(--font-mono);font-size:13px;color:var(--muted-on-bg);padding:20px 0;text-align:center;border:1px dashed var(--line-on-bg);border-radius:8px;text-shadow:0 1px 4px rgba(0,0,0,.35);}
  textarea{font-family:var(--font-body);font-size:14px;resize:vertical;}
  .search{display:flex;gap:8px;margin-bottom:6px;}
  .search input{flex:1;}
  .result-date{font-family:var(--font-mono);font-size:11px;color:var(--muted-on-card);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.06em;}
  .hint{font-size:12px;color:var(--muted-on-bg);margin-top:4px;text-shadow:0 1px 4px rgba(0,0,0,.35);}
  @media(max-width:520px){
    .grid-form{grid-template-columns:1fr 1fr;}
    .grid-form .wide{grid-column:1/-1;}
    .edit-form{grid-template-columns:1fr 1fr;}
    .edit-form .full{grid-column:1/-1;}
    .edit-form .wide{grid-column:1/-1;}
  }
</style>
</head>
<body>
<div class="wrap">

  <p class="eyebrow">Kassël home &amp; living</p>
  <h1>Respuestas Quatro</h1>
  <div class="rule"></div>

  <div id="authBar" class="authbar"></div>

  <div class="datebar">
    <label for="routeDate">Fecha de ruta</label>
    <input type="date" id="routeDate">
    <button class="btn secondary small" id="todayBtn" type="button">Hoy</button>
    <span class="hint" id="dateHint"></span>
  </div>
  <div id="storageBanner" style="display:none;font-family:var(--font-mono);font-size:12px;color:var(--ink-on-bg);background:rgba(207,144,96,.14);border:1px solid var(--gold);border-radius:6px;padding:8px 12px;margin-bottom:18px;"></div>

  <div class="section-title" id="addSectionTitle" style="display:none;">Agregar jaula <span class="n">manual</span></div>
  <div class="panel" id="addPanel" style="display:none;">
    <div class="grid-form">
      <div><label class="f">Jaula</label><input type="text" id="fParada" placeholder="1"></div>
      <div><label class="f">Código</label><input type="text" id="fCodigo" placeholder="OZA1326" style="font-family:var(--font-mono);text-transform:uppercase;"></div>
      <div class="wide"><label class="f">Tipo</label>
        <input type="text" id="fTipo" list="tiposList" placeholder="Mercancía de piso Puebla">
        <datalist id="tiposList">
          <option value="Mercancía de piso Puebla">
          <option value="Mercancía de piso Queretaro">
          <option value="Mercancía de piso Metepec">
          <option value="Mercancía de piso Polanco">
          <option value="Mercancía de piso Interlomas">
          <option value="Mercancía de piso La viga">
          <option value="Mercancía de piso Toreo">
          <option value="Mercancía de piso Perinorte">
          <option value="Mercancía de piso Gustavo baz">
          <option value="Mercancía de piso Miramontes">
          <option value="Mercancía de piso Santa fe">
          <option value="Mercancía de piso Zaragoza">
          <option value="Planta entrega directo">
          <option value="Cliente recolecta en tienda">
          <option value="Reprogramado">
        </datalist>
      </div>
      <div class="wide"><label class="f">Ruta</label><input type="text" id="fRuta" placeholder="Ruta 3"></div>
      <div class="full"><label class="f">Nota</label><textarea id="fNota" placeholder="Detalle adicional (opcional)" style="min-height:44px;"></textarea></div>
    </div>
    <p class="err" id="formErr" style="display:none;"></p>
    <button class="btn" id="addBtn">Agregar jaula</button>
  </div>

  <div class="section-title">Jaulas del día <span class="n" id="countLabel"></span></div>
  <div class="entries" id="entriesList"></div>

  <div class="section-title">Buscar por código <span class="n">todas las fechas</span></div>
  <div class="panel">
    <div class="search">
      <input type="text" id="searchInput" placeholder="Ej. OZA1326" style="font-family:var(--font-mono);text-transform:uppercase;">
      <button class="btn secondary" id="searchBtn">Buscar</button>
    </div>
    <div id="searchResults"></div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, doc, updateDoc, getDocs,
  query, where, onSnapshot, arrayUnion
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCjs2YovORwSTp8eKcFmYg_b6IAXJSwVas",
  authDomain: "bitaora-quatro.firebaseapp.com",
  projectId: "bitaora-quatro",
  storageBucket: "bitaora-quatro.firebasestorage.app",
  messagingSenderId: "203422294093",
  appId: "1:203422294093:web:43a1de853e436666cc3c04",
  measurementId: "G-CDSYGLNXL9"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const jaulasCol = collection(db, 'jaulas');

// ---- Usuarios y roles (correos de prueba, luego se cambian por los reales) ----
const ENCARGADOS = {
  'josimar@bitacora-kassel.com': 'Josimar Mares',
  'cuauhtemoc@bitacora-kassel.com': 'Cuauhtémoc García'
};
const COMENTARISTAS = {
  'citlali@bitacora-kassel.com': 'Citlali',
  'ulises@bitacora-kassel.com': 'Ulises',
  'yareli@bitacora-kassel.com': 'Yareli',
  'nicole@bitacora-kassel.com': 'Nicole'
};
let currentUser = null; // {email, name, role: 'encargado' | 'comentarista' | 'publico'}
function isEncargado(){ return !!currentUser && currentUser.role === 'encargado'; }
function canComment(){ return !!currentUser && (currentUser.role === 'encargado' || currentUser.role === 'comentarista'); }

const authBar = document.getElementById('authBar');
function renderAuthBar(){
  if(currentUser){
    authBar.innerHTML =
      '<span class="hint">Sesión: <strong>'+escapeHtml(currentUser.name)+'</strong>'+
      (currentUser.role==='encargado' ? ' · encargado' : currentUser.role==='comentarista' ? ' · puede comentar' : ' · solo vista')+
      '</span><button class="iconbtn" id="logoutBtn" type="button">Cerrar sesión</button>';
    document.getElementById('logoutBtn').addEventListener('click', ()=> signOut(auth));
  } else {
    authBar.innerHTML =
      '<form id="loginForm" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">'+
        '<input type="email" id="loginEmail" placeholder="correo" autocomplete="username">'+
        '<input type="password" id="loginPass" placeholder="contraseña" autocomplete="current-password">'+
        '<button class="btn secondary small" type="submit">Iniciar sesión</button>'+
        '<span class="hint" id="loginErr" style="display:none;"></span>'+
      '</form>';
    document.getElementById('loginForm').addEventListener('submit', async (ev)=>{
      ev.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPass').value;
      const errEl = document.getElementById('loginErr');
      errEl.style.display = 'none';
      try{
        await signInWithEmailAndPassword(auth, email, pass);
      }catch(e){
        errEl.textContent = 'Correo o contraseña incorrectos.';
        errEl.style.display = 'inline';
      }
    });
  }
}

function updateFormVisibility(){
  const show = isEncargado() ? '' : 'none';
  document.getElementById('addPanel').style.display = show;
  document.getElementById('addSectionTitle').style.display = show;
}

onAuthStateChanged(auth, (user)=>{
  if(user && user.email){
    const email = user.email.toLowerCase();
    if(ENCARGADOS[email]){
      currentUser = {email, name: ENCARGADOS[email], role: 'encargado'};
    } else if(COMENTARISTAS[email]){
      currentUser = {email, name: COMENTARISTAS[email], role: 'comentarista'};
    } else {
      currentUser = {email, name: user.email, role: 'publico'};
    }
  } else {
    currentUser = null;
  }
  renderAuthBar();
  updateFormVisibility();
  subscribeDate(dateInput.value);
});

function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function fmtDateLabel(iso){
  const [y,m,d] = iso.split('-');
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return d + ' ' + meses[parseInt(m,10)-1] + ' ' + y;
}

const dateInput = document.getElementById('routeDate');
const dateHint = document.getElementById('dateHint');
const entriesList = document.getElementById('entriesList');
const countLabel = document.getElementById('countLabel');
dateInput.value = todayStr();

function showBanner(text){
  const el = document.getElementById('storageBanner');
  el.style.display = 'block';
  el.textContent = text;
}
function hideBanner(){
  document.getElementById('storageBanner').style.display = 'none';
}

function fmtTs(ts){
  return new Date(ts).toLocaleString('es-MX',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit',year:'numeric'});
}

// ---- Guardado real en Firestore, en vivo por fecha ----
let unsubscribe = null;
function subscribeDate(date){
  if(unsubscribe){ unsubscribe(); unsubscribe = null; }
  dateHint.textContent = fmtDateLabel(date);
  entriesList.innerHTML = '<div class="empty">Cargando...</div>';
  const q = query(jaulasCol, where('fecha', '==', date));
  unsubscribe = onSnapshot(q, (snap)=>{
    hideBanner();
    const entries = [];
    snap.forEach(d=> entries.push({id: d.id, ...d.data()}));
    entries.sort((a,b)=> (a.ts||0) - (b.ts||0));
    renderList(entries, date);
  }, (err)=>{
    console.error(err);
    showBanner('No se pudo conectar con la base de datos. Revisa tu conexión a internet e intenta de nuevo.');
    entriesList.innerHTML = '<div class="empty">No se pudo cargar.</div>';
  });
}

function renderList(entries, date){
  countLabel.textContent = entries.length ? entries.length + (entries.length===1?' jaula':' jaulas') : '';
  if(!entries.length){
    entriesList.innerHTML = '<div class="empty">Todavía no hay jaulas para esta fecha.</div>';
    return;
  }
  entriesList.innerHTML = '';
  entries.forEach(en=>{
    const div = document.createElement('div');
    div.className = 'ticket';
    div.setAttribute('data-id', en.id);
    renderTicketView(div, en, date);
    entriesList.appendChild(div);
  });
}

function renderTicketView(div, en, date){
  const tipoBadge = en.tipo ? '<span class="tipo-badge">'+escapeHtml(en.tipo)+'</span>' : '';
  const rutaBadge = en.ruta ? '<span class="ruta-badge">Ruta '+escapeHtml(en.ruta)+'</span>' : '';
  const history = en.history || [];
  const lastEdit = history.length > 1 ? history[history.length-1] : null;
  div.innerHTML =
    '<div class="parada">'+escapeHtml(en.parada||'—')+'</div>'+
    '<div class="ticket-body">'+
      '<span class="stamp">'+escapeHtml(en.codigo||'sin código')+'</span>'+tipoBadge+rutaBadge+
      (en.nota ? '<p class="nota">'+escapeHtml(en.nota)+'</p>' : '')+
      '<div class="meta">agregado por '+escapeHtml(en.usuario||'—')+' · '+fmtTs(en.ts)+(lastEdit ? ' · editado por '+escapeHtml(lastEdit.usuario||'—')+' · '+fmtTs(lastEdit.ts) : '')+'</div>'+
      (history.length ? '<button class="hist-toggle" data-action="hist">ver historial ('+history.length+')</button><div class="hist-list" style="display:none;"></div>' : '')+
      '<div class="comments" data-comments></div>'+
    '</div>'+
    '<div class="actions">'+
      (isEncargado() ? '<button class="iconbtn" data-action="edit">Editar</button>' : '')+
    '</div>';

  const editBtn = div.querySelector('[data-action="edit"]');
  if(editBtn){
    editBtn.addEventListener('click', ()=>{
      renderTicketEdit(div, en, date);
    });
  }
  const histBtn = div.querySelector('[data-action="hist"]');
  if(histBtn){
    histBtn.addEventListener('click', ()=>{
      const listDiv = div.querySelector('.hist-list');
      if(listDiv.style.display === 'none'){
        listDiv.innerHTML = history.slice().reverse().map(h=>{
          const label = h.accion === 'creado' ? 'creado' : 'editado';
          return '<span>'+label+' por '+escapeHtml(h.usuario||'—')+' · '+fmtTs(h.ts)+'</span>';
        }).join('');
        listDiv.style.display = 'flex';
        histBtn.textContent = 'ocultar historial';
      } else {
        listDiv.style.display = 'none';
        histBtn.textContent = 'ver historial ('+history.length+')';
      }
    });
  }
  renderComments(div, en);
}

async function loadComments(jaulaId){
  const snap = await getDocs(collection(db, 'jaulas', jaulaId, 'comentarios'));
  const arr = [];
  snap.forEach(d=> arr.push({id: d.id, ...d.data()}));
  arr.sort((a,b)=> (a.ts||0) - (b.ts||0));
  return arr;
}

async function renderComments(div, en){
  const box = div.querySelector('[data-comments]');
  if(!box) return;
  let comments = [];
  try{
    comments = await loadComments(en.id);
  }catch(e){
    console.error(e);
  }
  box.innerHTML = '';
  if(comments.length){
    const list = document.createElement('div');
    list.className = 'comments-list';
    comments.forEach(c=>{
      const p = document.createElement('div');
      p.className = 'comment-item';
      p.innerHTML =
        '<span class="comment-author">'+escapeHtml(c.autor||'')+'</span> · '+
        '<span class="comment-ts">'+fmtTs(c.ts)+'</span>'+
        '<p class="comment-text">'+escapeHtml(c.texto||'')+'</p>';
      list.appendChild(p);
    });
    box.appendChild(list);
  }
  if(canComment()){
    const form = document.createElement('div');
    form.className = 'comment-form';
    form.innerHTML =
      '<textarea placeholder="Escribe un comentario..." class="c-text"></textarea>'+
      '<button class="btn secondary small" type="button">Comentar</button>';
    const btn = form.querySelector('button');
    btn.addEventListener('click', async ()=>{
      const textEl = form.querySelector('.c-text');
      const text = textEl.value.trim();
      if(!text) return;
      btn.disabled = true;
      btn.textContent = 'Enviando...';
      try{
        await addDoc(collection(db, 'jaulas', en.id, 'comentarios'), {
          texto: text, autor: currentUser.name, autorEmail: currentUser.email, ts: Date.now()
        });
        textEl.value = '';
        await renderComments(div, en);
      }catch(e){
        console.error(e);
        btn.disabled = false;
        btn.textContent = 'Comentar';
      }
    });
    box.appendChild(form);
  }
}

function renderTicketEdit(div, en, date){
  div.innerHTML =
    '<div class="ticket-body" style="width:100%;">'+
      '<div class="edit-form">'+
        '<div><label class="f">Jaula</label><input type="text" class="e-parada" placeholder="1" value="'+escapeHtml(en.parada||'')+'"></div>'+
        '<div><label class="f">Código</label><input type="text" class="e-codigo" placeholder="OZA1326" value="'+escapeHtml(en.codigo||'')+'" style="font-family:var(--font-mono);text-transform:uppercase;"></div>'+
        '<div class="wide"><label class="f">Tipo</label><input type="text" class="e-tipo" placeholder="Mercancía de piso Puebla" value="'+escapeHtml(en.tipo||'')+'" list="tiposList"></div>'+
        '<div class="wide"><label class="f">Ruta</label><input type="text" class="e-ruta" placeholder="Ruta 3" value="'+escapeHtml(en.ruta||'')+'"></div>'+
        '<div class="full"><label class="f">Nota</label><textarea class="e-nota" style="min-height:44px;">'+escapeHtml(en.nota||'')+'</textarea></div>'+
      '</div>'+
      '<p class="err" style="display:none;"></p>'+
      '<div class="edit-actions">'+
        '<button class="btn small" data-action="save">Guardar cambios</button>'+
        '<button class="btn secondary small" data-action="cancel">Cancelar</button>'+
      '</div>'+
    '</div>';

  div.querySelector('[data-action="cancel"]').addEventListener('click', ()=>{
    renderTicketView(div, en, date);
  });
  div.querySelector('[data-action="save"]').addEventListener('click', async ()=>{
    if(!isEncargado()) return;
    const parada = div.querySelector('.e-parada').value.trim();
    const codigo = div.querySelector('.e-codigo').value.trim().toUpperCase();
    const tipo = div.querySelector('.e-tipo').value.trim();
    const ruta = div.querySelector('.e-ruta').value.trim();
    const nota = div.querySelector('.e-nota').value.trim();
    const err = div.querySelector('.err');
    if(!codigo && !nota){
      err.textContent = 'Ingresa al menos un código o una nota.';
      err.style.display = 'block';
      return;
    }
    const saveBtn = div.querySelector('[data-action="save"]');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Guardando...';
    try{
      await updateDoc(doc(db, 'jaulas', en.id), {
        parada, codigo, tipo, ruta, nota,
        history: arrayUnion({ts: Date.now(), accion: 'editado', usuario: currentUser.name, email: currentUser.email})
      });
      // La lista se vuelve a pintar sola por el guardado en vivo (onSnapshot).
    }catch(e){
      console.error(e);
      err.textContent = 'No se pudo guardar. Revisa tu conexión e intenta de nuevo.';
      err.style.display = 'block';
      saveBtn.disabled = false;
      saveBtn.textContent = 'Guardar cambios';
    }
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

dateInput.addEventListener('change', ()=> subscribeDate(dateInput.value));

document.getElementById('todayBtn').addEventListener('click', ()=>{
  dateInput.value = todayStr();
  subscribeDate(dateInput.value);
});

document.getElementById('addBtn').addEventListener('click', async ()=>{
  if(!isEncargado()) return;
  const parada = document.getElementById('fParada').value.trim();
  const codigo = document.getElementById('fCodigo').value.trim().toUpperCase();
  const tipo = document.getElementById('fTipo').value.trim();
  const ruta = document.getElementById('fRuta').value.trim();
  const nota = document.getElementById('fNota').value.trim();
  const err = document.getElementById('formErr');
  if(!codigo && !nota){
    err.textContent = 'Ingresa al menos un código o una nota.';
    err.style.display = 'block';
    return;
  }
  err.style.display = 'none';
  const addBtn = document.getElementById('addBtn');
  addBtn.disabled = true;
  addBtn.textContent = 'Guardando...';
  try{
    await addDoc(jaulasCol, {
      fecha: dateInput.value, parada, codigo, tipo, ruta, nota,
      ts: Date.now(), usuario: currentUser.name, usuarioEmail: currentUser.email,
      history: [{ts: Date.now(), accion: 'creado', usuario: currentUser.name, email: currentUser.email}]
    });
    document.getElementById('fParada').value='';
    document.getElementById('fCodigo').value='';
    document.getElementById('fTipo').value='';
    document.getElementById('fRuta').value='';
    document.getElementById('fNota').value='';
    // La lista se actualiza sola por el guardado en vivo (onSnapshot).
  }catch(e){
    console.error(e);
    err.textContent = 'No se pudo guardar. Revisa tu conexión e intenta de nuevo.';
    err.style.display = 'block';
  }
  addBtn.disabled = false;
  addBtn.textContent = 'Agregar jaula';
});

document.getElementById('searchBtn').addEventListener('click', async ()=>{
  const q = document.getElementById('searchInput').value.trim().toUpperCase();
  const resultsDiv = document.getElementById('searchResults');
  if(!q){ resultsDiv.innerHTML = ''; return; }
  resultsDiv.innerHTML = '<div class="empty">Buscando...</div>';
  try{
    const snap = await getDocs(jaulasCol);
    let found = [];
    snap.forEach(d=>{
      const en = d.data();
      if((en.codigo||'').toUpperCase().includes(q)){
        found.push({date: en.fecha, entry: en});
      }
    });
    if(!found.length){
      resultsDiv.innerHTML = '<div class="empty">Sin resultados para "'+escapeHtml(q)+'".</div>';
      return;
    }
    found.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
    resultsDiv.innerHTML = '';
    let lastDate = null;
    found.forEach(({date, entry})=>{
      if(date !== lastDate){
        const h = document.createElement('div');
        h.className = 'result-date';
        h.textContent = fmtDateLabel(date);
        resultsDiv.appendChild(h);
        lastDate = date;
      }
      const div = document.createElement('div');
      div.className = 'ticket';
      div.innerHTML =
        '<div class="parada">'+escapeHtml(entry.parada||'—')+'</div>'+
        '<div class="ticket-body">'+
          '<span class="stamp">'+escapeHtml(entry.codigo||'sin código')+'</span>'+
          (entry.tipo ? '<span class="tipo-badge">'+escapeHtml(entry.tipo)+'</span>' : '')+
          (entry.ruta ? '<span class="ruta-badge">Ruta '+escapeHtml(entry.ruta)+'</span>' : '')+
          (entry.nota ? '<p class="nota">'+escapeHtml(entry.nota)+'</p>' : '')+
          '<div class="meta">agregado por '+escapeHtml(entry.usuario||'—')+(entry.ts ? ' · '+fmtTs(entry.ts) : '')+'</div>'+
        '</div>';
      resultsDiv.appendChild(div);
    });
  }catch(e){
    console.error(e);
    resultsDiv.innerHTML = '<div class="empty">No se pudo buscar. Intenta de nuevo.</div>';
  }
});
// La primera carga ocurre sola cuando Firebase resuelve la sesión (onAuthStateChanged arriba).
</script>
</body>
</html>
